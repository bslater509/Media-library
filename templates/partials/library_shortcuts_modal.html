<div id="shortcutsModal" class="ml-sheet fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[1200] hidden flex items-center justify-center p-3 sm:p-4">
    <div class="ml-sheet-card bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150 text-slate-200 max-h-[90vh]" onclick="event.stopPropagation()">
      <div class="ml-sheet-grabber" data-sheet-grabber></div>

      <div class="flex items-center justify-between gap-3 px-4 pt-3 pb-2.5 border-b border-slate-800 bg-slate-950/40">
        <div class="flex items-center gap-2.5 min-w-0">
          <span data-lb-icon="keyboard" data-lb-icon-class="w-5 h-5 text-slate-400"></span>
          <div class="min-w-0">
            <h3 id="shortcutsModalTitle" class="text-sm font-bold text-white">Keyboard Shortcuts</h3>
            <p class="text-[10px] text-slate-400">Press <kbd class="px-1 py-0.5 rounded bg-slate-800 border border-slate-700 font-mono text-[10px] text-slate-300">?</kbd> any time to reopen this list</p>
          </div>
        </div>
        <button id="closeShortcutsBtn" type="button" title="Close (Esc)" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition text-base shrink-0">✕</button>
      </div>

      <div id="shortcutsGroups" class="flex-1 min-h-0 overflow-y-auto no-scrollbar overscroll-contain p-3 sm:p-4 flex flex-col gap-3 sm:gap-4"></div>

      <div class="px-4 py-2.5 border-t border-slate-800 bg-slate-950/40 flex items-center justify-between gap-2">
        <span class="text-[10px] text-slate-500">Shortcuts are ignored while a text field is focused.</span>
        <button id="closeShortcutsFooterBtn" type="button" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition">Close</button>
      </div>
    </div>
  </div>
