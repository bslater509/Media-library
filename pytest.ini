[pytest]
pythonpath = .
testpaths = tests
norecursedirs = node_modules data venv .git frontend
# The suite runs one worker per CPU by default (pytest-xdist); the isolated
# per-test index makes the tests independent. Pass ``-n0`` to run serially.
addopts = --basetemp=data/pytest_tmp -n auto --cov=media_library --cov-report=term-missing --cov-fail-under=100
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
