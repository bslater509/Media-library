<div id="uploadReviewModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[80] hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden text-slate-200 flex flex-col">
      <div class="px-5 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><span>⬆️</span> Upload to Library</h3>
        <button type="button" id="cancelUploadReviewBtnTop" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">✕</button>
      </div>
      <div class="px-5 py-4 flex flex-col gap-4">
        <div class="flex flex-col gap-1 text-sm">
          <div class="flex justify-between items-center"><span class="text-slate-400">Target Folder:</span> <span id="uploadTargetFolderLabel" class="font-mono text-emerald-400 truncate max-w-[200px]">/</span></div>
          <div class="flex justify-between items-center"><span class="text-slate-400">Total Files:</span> <span id="uploadTotalFilesLabel" class="font-bold text-white">0</span></div>
          <div class="flex justify-between items-center"><span class="text-slate-400">Total Size:</span> <span id="uploadTotalSizeLabel" class="font-mono text-slate-300">0 MB</span></div>
        </div>
        
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">If a file already exists</label>
          <select id="uploadCollisionPolicy" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition">
            <option value="auto-rename">Auto-rename (e.g. file (1).ext)</option>
            <option value="skip">Skip existing file</option>
            <option value="overwrite">Overwrite existing file</option>
          </select>
        </div>
        
        <div id="uploadWarningText" class="text-xs text-amber-400 hidden p-2 bg-amber-500/10 rounded-lg border border-amber-500/20"></div>
      </div>
      <div class="px-5 py-3 border-t border-slate-800 bg-slate-950 flex justify-end gap-2">
        <button type="button" id="cancelUploadReviewBtn" class="px-4 py-2 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition font-medium">Cancel</button>
        <button type="button" id="startUploadBtn" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-lg transition shadow-sm font-semibold flex items-center gap-2">Start Upload</button>
      </div>
    </div>
  </div>

  <div id="renameModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[1200] hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-md w-full shadow-2xl flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <span>✏️</span> Rename File
        </h3>
        <button id="closeRenameModalBtn" class="text-slate-400 hover:text-white text-base">✕</button>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="newFileNameInput" class="text-xs text-slate-400">File Name:</label>
        <input 
          type="text" 
          id="newFileNameInput" 
          class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-xs text-white focus:outline-none font-mono"
        />
        <p class="text-[10px] text-slate-500">Include the file extension (e.g. .mp4, .jpg)</p>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button id="cancelRenameBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition">
          Cancel
        </button>
        <button id="confirmRenameBtn" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-white transition shadow-sm">
          Save Name
        </button>
      </div>
    </div>
  </div>

<div id="newFolderModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[80] hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-md w-full shadow-2xl flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <span>📁</span> New Folder
        </h3>
        <button id="closeNewFolderModalBtn" class="text-slate-400 hover:text-white text-base">✕</button>
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="newFolderNameInput" class="text-xs text-slate-400">Folder Name:</label>
        <input
          type="text"
          id="newFolderNameInput"
          class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-xs text-white focus:outline-none font-mono"
          placeholder="e.g. Vacation 2024"
        />
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button id="cancelNewFolderBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition">
          Cancel
        </button>
        <button id="confirmNewFolderBtn" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-white transition shadow-sm">
          Create
        </button>
      </div>
    </div>
  </div>

<div id="moveConflictModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[80] hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-900/50 rounded-2xl p-5 max-w-md w-full shadow-2xl flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0 text-lg">⚠️</div>
        <div>
          <h3 class="text-sm font-bold text-white">Name Conflicts Detected</h3>
          <p class="text-xs text-slate-400" id="moveConflictCount">Some items already exist at the destination.</p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-1">
        <button id="moveConflictCancelBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition">Cancel</button>
        <button id="moveConflictSkipBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition">Skip Conflicts</button>
        <button id="moveConflictRenameBtn" class="px-4 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-xs font-semibold text-white transition shadow-sm">Auto-rename</button>
      </div>
    </div>
  </div>
