<div id="duplicatesModal" class="ml-sheet fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[80] hidden flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 h-[100dvh] max-h-[100dvh]">
    <div class="ml-sheet-card bg-slate-900 border border-amber-500/30 rounded-2xl w-full max-w-6xl h-full max-h-full sm:h-auto sm:max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      
      <!-- Drag handle (mobile sheets) -->
      <div class="ml-sheet-grabber" data-sheet-grabber></div>

      <!-- Modal Header -->
      <div class="px-3.5 py-2.5 sm:px-6 sm:py-3.5 bg-slate-950/80 border-b border-slate-800 grid grid-cols-[1fr_auto] md:flex md:items-center md:justify-between gap-2.5 sm:gap-3 shrink-0">
        
        <!-- Left / Row 1 Left: Icon + Title + Set Pill -->
        <div class="col-start-1 row-start-1 flex items-center gap-2 sm:gap-2.5 min-w-0">
          <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0 text-sm sm:text-base">
            🔍
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 sm:gap-2">
              <h3 class="text-sm sm:text-base font-bold text-white truncate">
                <span class="sm:hidden">Duplicates</span>
                <span class="hidden sm:inline">Duplicate Files Review</span>
              </h3>
              <span id="duplicatesGroupPill" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-mono border border-amber-500/30 shrink-0">Set 1 of 0</span>
            </div>
            <p id="duplicatesSubtitle" class="text-[11px] sm:text-xs text-slate-400 truncate hidden sm:block">Detect, compare, and safely clean up duplicate files</p>
          </div>
        </div>

        <!-- Right / Row 1 Right: Ignored Button + Close Button -->
        <div class="col-start-2 row-start-1 md:order-3 flex items-center gap-1.5 sm:gap-2 shrink-0 justify-self-end">
          <button id="openIgnoredDuplicatesBtn" class="px-2 sm:px-2.5 py-1 rounded-xl bg-slate-800/80 border border-slate-700/60 hover:bg-slate-700 text-slate-300 hover:text-white text-[11px] font-medium flex items-center gap-1.5 transition shadow-sm cursor-pointer" title="View ignored duplicate matches">
            <i class="fa-solid fa-ban text-amber-400"></i>
            <span><span class="hidden sm:inline">Ignored </span>(<span id="ignoredDuplicatesCount">0</span>)</span>
          </button>
          <button id="closeDuplicatesModalBtn" class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-xs sm:text-sm transition" title="Close Modal (Esc)">
            ✕
          </button>
        </div>

        <!-- Mode Switcher Tabs: Row 2 (Full width) on mobile, Center/Right (order-2) on desktop -->
        <div class="col-span-2 row-start-2 md:order-2 w-full md:w-auto">
          <div class="grid grid-cols-2 w-full md:w-auto bg-slate-950 p-0.5 rounded-xl border border-slate-800 text-[11px] font-medium text-center">
            <button id="dupModeContentBtn" class="px-2.5 sm:px-3 py-1 rounded-lg bg-amber-600 text-white font-semibold shadow-sm transition text-center truncate font-medium">
              <span class="sm:hidden">Size & Hash</span><span class="hidden sm:inline">Content (Size & Hash)</span>
            </button>
            <button id="dupModeVisualBtn" class="px-2.5 sm:px-3 py-1 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1 text-center truncate font-medium">
              <i class="fa-solid fa-eye text-sky-400 shrink-0"></i>
              <span class="sm:hidden">Visual</span><span class="hidden sm:inline">Visual (Videos)</span>
            </button>
          </div>
        </div>

      </div>

      <!-- Verification & Navigator Toolbar -->
      <div class="px-3.5 py-2 sm:px-6 sm:py-2.5 bg-slate-950/40 border-b border-slate-800/80 flex flex-col sm:flex-row sm:items-center sm:justify-between text-xs gap-2 sm:gap-3 shrink-0">
        
        <!-- Left: Status & Pre-hashing info -->
        <div class="flex items-center justify-between sm:justify-start gap-2 min-w-0">
          <span id="duplicatesVerificationBadge" class="text-[11px] font-mono px-2 sm:px-2.5 py-0.5 rounded-lg bg-slate-800 text-slate-400 flex items-center gap-1.5 border border-slate-700 min-w-0 truncate max-w-full">
            <span class="w-2 h-2 rounded-full bg-slate-500 shrink-0"></span>
            <span class="truncate">Checking hash...</span>
          </span>
          <span id="duplicatesGroupSizeBadge" class="text-slate-400 font-mono text-[11px] truncate hidden sm:inline"></span>
          <!-- Background Hash Pre-Verification Live Status Pill -->
          <div id="duplicateBgHashBadge" class="hidden sm:flex items-center gap-1.5 text-[10px] font-mono px-2 py-0.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 shrink-0">
            <span id="dupBgHashIcon" class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="dupBgHashText">Pre-hashing: 0%</span>
            <button id="dupBgHashPauseBtn" class="text-amber-400 hover:text-white underline ml-1 font-sans">Pause</button>
          </div>
        </div>

        <!-- Right: Actions & Pagination -->
        <div class="flex items-center justify-between sm:justify-end gap-1.5 sm:gap-2 w-full sm:w-auto shrink-0">
          <label class="hidden md:flex items-center gap-1.5 cursor-pointer text-[11px] text-slate-300 hover:text-white select-none bg-slate-900/90 px-2.5 py-1 rounded-xl border border-slate-800 transition" title="Automatically keep recommended file and delete duplicate copy as soon as a 100% hash match is verified">
            <input type="checkbox" id="autoDeleteOnBrowseToggle" class="rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0 w-3.5 h-3.5 cursor-pointer">
            <span class="font-medium text-emerald-400">⚡ Auto-delete on 100% match</span>
          </label>

          <button 
            id="autoDeleteAllVerifiedBtn" 
            class="flex-1 sm:flex-initial px-2 sm:px-2.5 py-1.5 sm:py-1 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-[11px] font-semibold flex items-center justify-center gap-1 sm:gap-1.5 shadow-sm transition active:scale-95 cursor-pointer disabled:opacity-40 disabled:pointer-events-none truncate"
            title="Automatically keep recommended file and delete duplicates for all 100% hash-verified sets"
          >
            <span>⚡</span>
            <span class="truncate"><span class="sm:hidden">Auto-Delete</span><span class="hidden sm:inline">Auto-Delete All Verified</span></span>
            <span id="autoDeleteBadgeCount" class="px-1.5 py-0.2 rounded-full bg-emerald-950 text-emerald-300 text-[10px] font-mono border border-emerald-700/80 shrink-0">0</span>
          </button>

          <button 
            id="ignoreCurrentGroupBtn" 
            class="px-2 sm:px-2.5 py-1.5 sm:py-1 rounded-xl bg-slate-900 hover:bg-amber-950/40 border border-slate-700 hover:border-amber-500/50 text-slate-300 hover:text-amber-300 text-[11px] font-medium flex items-center justify-center gap-1 sm:gap-1.5 transition shadow-sm cursor-pointer shrink-0" 
            title="Ignore this match so it never appears in duplicate scans again"
          >
            <i class="fa-solid fa-ban text-amber-400 shrink-0"></i>
            <span>Ignore<span class="hidden sm:inline"> Match</span></span>
          </button>

          <div class="h-4 w-px bg-slate-800 mx-0.5 hidden sm:block"></div>

          <div class="flex items-center gap-1 sm:gap-2 shrink-0">
            <button id="prevDuplicateGroupBtn" class="px-2 sm:px-2.5 py-1.5 sm:py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium flex items-center gap-1 transition disabled:opacity-40 disabled:pointer-events-none">
              ◀<span class="hidden sm:inline"> Prev</span>
            </button>
            <span id="duplicateGroupCounter" class="text-slate-300 font-mono text-[11px] sm:text-xs px-1 shrink-0 whitespace-nowrap">1 / 1</span>
            <button id="nextDuplicateGroupBtn" class="px-2 sm:px-2.5 py-1.5 sm:py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium flex items-center gap-1 transition disabled:opacity-40 disabled:pointer-events-none">
              <span class="hidden sm:inline">Next </span>▶
            </button>
          </div>
        </div>

      </div>

      <!-- Main Stage: Side-by-Side Comparison Container -->
      <div id="duplicateCardsContainer" class="flex-1 min-h-0 overflow-y-auto p-3 sm:p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
        <!-- Rendered dynamically -->
      </div>

      <!-- Footer Info Bar -->
      <div class="px-3.5 py-2.5 sm:px-6 sm:py-3 bg-slate-950/80 border-t border-slate-800 flex items-center justify-between gap-3 text-xs shrink-0 pb-[max(0.625rem,env(safe-area-inset-bottom))]">
        <div class="flex items-center gap-2 text-slate-400 min-w-0">
          <span class="shrink-0">Reclaimable:</span>
          <span id="duplicatesTotalReclaimable" class="text-emerald-400 font-mono font-bold shrink-0">0 GB</span>
          <span class="text-slate-600 hidden sm:inline">|</span>
          <span id="duplicatesTotalSets" class="text-slate-300 font-mono hidden sm:inline truncate">0 duplicate sets</span>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button id="refreshDuplicatesBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium flex items-center gap-1.5 transition">
            <span>↻</span> Rescan
          </button>
        </div>
      </div>

    </div>
  </div>

<div id="ignoredDuplicatesModal" class="ml-sheet fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[80] hidden flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 h-[100dvh] max-h-[100dvh]">
    <div class="ml-sheet-card bg-slate-900 border border-slate-700/80 rounded-2xl w-full max-w-3xl h-full max-h-full sm:h-auto sm:max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      
      <!-- Drag handle (mobile sheets) -->
      <div class="ml-sheet-grabber" data-sheet-grabber></div>

      <!-- Header -->
      <div class="px-5 py-4 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0 text-sm">
            <i class="fa-solid fa-ban"></i>
          </div>
          <div class="min-w-0">
            <h3 class="text-sm sm:text-base font-bold text-white truncate">Ignored Duplicate Matches</h3>
            <p class="text-xs text-slate-400 truncate">Pairs marked to be ignored will not appear in duplicate scans</p>
          </div>
        </div>
        <button id="closeIgnoredDuplicatesModalBtn" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-sm transition" title="Close (Esc)">
          ✕
        </button>
      </div>

      <!-- List Container -->
      <div id="ignoredDuplicatesList" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
        <!-- Rendered dynamically -->
      </div>

      <!-- Footer -->
      <div class="px-5 py-3 bg-slate-950/80 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400 shrink-0">
        <span id="ignoredDuplicatesFooterCount" class="font-mono">0 ignored pairs</span>
        <button id="closeIgnoredDuplicatesFooterBtn" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition cursor-pointer">
          Close
        </button>
      </div>
    </div>
  </div>
