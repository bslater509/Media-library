# Ruff configuration for the Media Library & Video Sorter.
#
# The default rule set is kept, with two rules intentionally excluded:
#
# - BLE001 (blind-except) and S110 (try-except-pass): this codebase
#   deliberately catches broad exceptions in long-running background workers,
#   FUSE/FFmpeg fallbacks, and best-effort cleanup so a single transient
#   failure can never kill a worker or a request. Narrowing those catches
#   would change runtime behaviour, so they are excluded here and reviewed
#   ad hoc.
#
# - SIM118 (`key in dict` instead of `key in dict.keys()`): the application
#   reads rows from `sqlite3.Row`, which implements `keys()` but not
#   `__contains__`; `"col" in row` would iterate over the row's *values* and
#   always be false. The flagged `key in row.keys()` guards are correct and
#   must not be rewritten.

# The package needs Python 3.10 (PEP 604 union syntax in annotations is
# evaluated at runtime). Stating it here keeps rules that only make sense on a
# newer target — e.g. UP041 rewriting `asyncio.TimeoutError`, whose builtin
# alias only exists from 3.11 — from firing.
target-version = "py310"

[lint]
ignore = ["BLE001", "S110", "SIM118"]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
]
