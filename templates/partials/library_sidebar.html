<aside id="sidebarDrawer" class="fixed top-0 bottom-0 left-0 z-[45] w-72 sm:w-80 bg-slate-900 border-r border-slate-800/80 p-3.5 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 md:static md:h-full shrink-0 shadow-2xl md:shadow-none">
      
      <!-- Sidebar Header & Search -->
      <div class="flex flex-col gap-2.5 pb-3 border-b border-slate-800">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xs uppercase font-bold tracking-wider text-slate-400">Categories</span>
            <span id="folderCountBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">0 folders</span>
          </div>
          <button id="closeSidebarBtn" type="button" class="md:hidden p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition active:scale-95" title="Close categories" aria-label="Close categories">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="relative">
          <input 
            type="text" 
            id="folderSearchInput" 
            placeholder="Search folders..." 
            class="w-full bg-slate-950/80 border border-slate-700/80 focus:border-emerald-500 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none transition font-sans"
          />
          <svg class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>

      <!-- Favorites Collection Button -->
      <div class="pt-2 pb-1">
        <button id="sidebarFavoritesBtn" type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 transition text-left cursor-pointer active:scale-95 shadow-sm">
          <span class="text-amber-400 text-sm leading-none">⭐</span>
          <span>Favorites</span>
          <span id="sidebarFavoritesBadge" class="ml-auto text-[10px] font-mono px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">0</span>
        </button>
      </div>

      <!-- Root Folders List -->
      <div id="rootFolderList" class="flex-1 overflow-y-auto no-scrollbar py-2 space-y-1">
        <div class="text-center py-8 text-xs text-slate-500">Loading categories...</div>
      </div>

      <!-- Sidebar Footer: Downloads + Analytics shortcuts (mainly for the mobile drawer) -->
      <div class="pt-2.5 pb-1 border-t border-slate-800 space-y-1">
        <a href="/downloads" class="flex items-center gap-2 px-2.5 py-2 rounded-xl text-xs font-semibold text-slate-200 hover:bg-slate-800 hover:text-white transition">
          <span>🔗</span>
          <span>Downloads</span>
          <span class="ml-auto text-[10px] font-mono text-slate-500">URL → Library</span>
        </a>
        <a href="/people" class="flex items-center gap-2 px-2.5 py-2 rounded-xl text-xs font-semibold text-slate-200 hover:bg-slate-800 hover:text-white transition">
          <span>🧑</span>
          <span>People</span>
          <span id="sidebarPeopleBadge" class="ml-auto text-[10px] font-mono text-slate-500">Faces &amp; names</span>
        </a>
        <a href="/analytics" class="flex items-center gap-2 px-2.5 py-2 rounded-xl text-xs font-semibold text-slate-200 hover:bg-slate-800 hover:text-white transition">
          <span>📊</span>
          <span>Analytics</span>
          <span class="ml-auto text-[10px] font-mono text-slate-500">Storage &amp; health</span>
        </a>
        <p class="px-2.5 pt-1 pb-0.5 text-[10px] font-mono text-slate-600">Media Library &amp; Video Sorter v{{VERSION}}</p>
      </div>
      
    </aside>
